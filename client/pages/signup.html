<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up | AI Vectorizer Tools</title>
<meta name="description" content="Create your free AI Vectorizer Tools account.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/ai-vectorizer-tools-5.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/ai-vectorizer-tools-5.png">
<link rel="apple-touch-icon" sizes="48x48" href="/assets/images/ai-vectorizer-tools-5.png">
<link rel="stylesheet" href="/assets/css/style.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<div class="nav-wrap">
  <div class="container">
    <nav class="nav">
       <a class="nav-logo" href="/">
        <img class="nav-logo-mark" src="/assets/images/ai-vectorizer-tools-1.png" alt="ai vectorizer tools">
      </a>
      <div class="nav-links"></div>
      <div class="nav-actions">
        <a href="/login" class="btn btn-ghost">Log in</a>
      </div>
    </nav>
  </div>
</div>

<div class="container" style="padding:56px 0 100px; display:flex; justify-content:center;">
  <div class="auth-card glass">
    <h1>Create your account</h1>
    <p class="auth-sub">Free to start — 5 conversions every month, all 7 tools included.</p>

    <a href="/api/auth/google" class="btn btn-ghost auth-google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.96H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.04l2.97-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A8.6 8.6 0 0 0 9 0 9 9 0 0 0 .98 4.96l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </a>

    <div class="auth-divider"><span>or</span></div>

    <form id="signup-form">
      <label class="auth-label" for="full-name">Full name</label>
      <input class="auth-input" type="text" id="full-name" autocomplete="name" placeholder="Your name">

      <label class="auth-label" for="email">Email</label>
      <input class="auth-input" type="email" id="email" autocomplete="email" required placeholder="you@example.com">

      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" type="password" id="password" autocomplete="new-password" required placeholder="At least 8 characters">

      <div id="error-banner" class="error-banner is-hidden" style="margin:16px 0 0;"></div>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; margin-top:22px; padding:15px;">
        Create account
      </button>
    </form>

    <p class="auth-footer-note">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; 2026 AI Vectorizer Tools</span>
      <span>Made for creators, everywhere</span>
    </div>
  </div>
</footer>

<script src="/assets/js/signup.js"></script>
</body>
</html>
